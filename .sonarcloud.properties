# SonarCloud automatic analysis configuration.

# docs/ is the built website and dist/ is the packed extension. Both are
# generated by `pnpm --dir website build` and `npm run build`, so the minified
# bundles there are not reviewable source and their findings are not actionable.
sonar.exclusions=docs/**,dist/**

# Declare the suite so test-only patterns are rated as test code, not production.
sonar.tests=tests
