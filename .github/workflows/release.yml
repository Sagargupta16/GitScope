name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # release-please maintains a release PR that bumps package.json + manifest.json
  # and the changelog from conventional commits. Merging that PR tags the release
  # and flips release_created, which gates the build + publish jobs below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: pnpm --dir website install --frozen-lockfile

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

      - run: npm run build:worker

      - name: Verify compatible authentication service
        run: node scripts/check-production.mjs --auth-only

      - name: Create zip artifact
        run: cd dist && zip -r ../gitscope-${{ needs.release-please.outputs.tag_name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: gitscope-${{ needs.release-please.outputs.tag_name }}.zip
          if-no-files-found: error

      - name: Attach build to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: gitscope-${{ needs.release-please.outputs.tag_name }}.zip

  publish-to-chrome:
    runs-on: ubuntu-latest
    needs: [release-please, build-and-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-extension

      # A release is not fully published when the store rejects the upload.
      - name: Upload to Chrome Web Store
        id: chrome-upload
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: gitscope-${{ needs.release-please.outputs.tag_name }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      # Store review can remain pending after the publish request succeeds.
      - name: Report store upload outcome
        if: always()
        env:
          OUTCOME: ${{ steps.chrome-upload.outcome }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ "${OUTCOME}" = "success" ]; then
            echo "Submitted ${TAG} to the Chrome Web Store."
            echo "Submitted \`${TAG}\` to the Chrome Web Store. Confirm the public listing version after store review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::Chrome Web Store submission did not succeed (${OUTCOME}). Check the upload step for the cause."
          {
            echo "### Chrome Web Store submission failed"
            echo
            echo "Release \`${TAG}\` is tagged and the zip is attached to the GitHub Release."
            echo "The store upload reported \`${OUTCOME}\`, so **the extension was not published**."
            echo
            echo "Check the upload error and release credentials, or upload the exact release zip from the"
            echo "[Developer Dashboard](https://chrome.google.com/webstore/devconsole)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
