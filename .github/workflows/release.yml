name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # release-please maintains a release PR that bumps package.json + manifest.json
  # and the changelog from conventional commits. Merging that PR tags the release
  # and flips release_created, which gates the build + publish jobs below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Dependency lifecycle scripts are not needed to build or test this repo,
      # so skip them rather than run arbitrary install-time code in a release.
      - run: npm ci --ignore-scripts

      - run: pnpm --dir website install --frozen-lockfile --ignore-scripts

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

      - run: npm run build:worker

      - name: Verify compatible authentication service
        run: node scripts/check-production.mjs --auth-only

      - name: Create zip artifact
        run: cd dist && zip -r ../gitscope-${{ needs.release-please.outputs.tag_name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: gitscope-${{ needs.release-please.outputs.tag_name }}.zip
          if-no-files-found: error

      - name: Attach build to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: gitscope-${{ needs.release-please.outputs.tag_name }}.zip

  publish-to-chrome:
    runs-on: ubuntu-latest
    needs: [release-please, build-and-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: release-extension

      # The action's publish call returned HTTP 400 on 1.2.1 and 1.2.2 even though
      # both reached the store, so its exit code cannot decide the outcome. Let it
      # run, then ask the store what it actually holds in the next step.
      - name: Upload to Chrome Web Store
        id: chrome-upload
        continue-on-error: true
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: gitscope-${{ needs.release-please.outputs.tag_name }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      # This is what makes the store step blocking: it fails when the store does
      # not hold the released version, rather than trusting the upload's status.
      - name: Verify the store holds this release
        id: chrome-verify
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/check-store-version.mjs "${TAG#v}"

      - name: Report store outcome
        if: always()
        env:
          UPLOAD: ${{ steps.chrome-upload.outcome }}
          VERIFY: ${{ steps.chrome-verify.outcome }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ "${VERIFY}" = "success" ]; then
            echo "The Chrome Web Store holds ${TAG}."
            {
              echo "### Chrome Web Store has \`${TAG}\`"
              echo
              echo "Upload step reported \`${UPLOAD}\`; the store was then queried directly and holds this version."
              echo "The public listing updates once store review and rollout complete, which can take hours."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::The Chrome Web Store does not hold ${TAG}."
          {
            echo "### Chrome Web Store does not have \`${TAG}\`"
            echo
            echo "Release \`${TAG}\` is tagged and the zip is attached to the GitHub Release."
            echo "Upload reported \`${UPLOAD}\` and the store check reported \`${VERIFY}\`."
            echo
            echo "Check the release credentials, or upload the exact release zip from the"
            echo "[Developer Dashboard](https://chrome.google.com/webstore/devconsole)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
