name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [website/**, docs/**, .github/workflows/pages.yml, scripts/check-production.mjs]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # Dependency lifecycle scripts are not needed to build or test this repo,
      # so skip them rather than run arbitrary install-time code in CI.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: website

      - run: npm ci --ignore-scripts

      - run: npm test

      - run: pnpm build
        working-directory: website

      - name: Verify compatible authentication service
        run: node scripts/check-production.mjs --auth-only

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
